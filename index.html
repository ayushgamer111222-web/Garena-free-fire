
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garena Fan Design</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f8fafc;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 90%;
  max-width: 420px;
  text-align: center;
}

.logo {
  color: #ff0015;
  font-size: 58px;
  font-weight: bold;
  margin-bottom: 45px;
}

h1 {
  color: #111827;
  font-size: 38px;
  margin-bottom: 35px;
}

.field {
  display: flex;
  align-items: center;
  width: 100%;
  height: 65px;
  border: 2px solid #d1d5db;
  border-radius: 10px;
  background: white;
  margin-bottom: 18px;
  padding: 15px;
  color: #929bb0;
  font-size: 19px;
  text-align: left;
}

.icon {
  font-size: 25px;
  margin-right: 20px;
}

button {
  width: 100%;
  height: 65px;
  background: #ff1025;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 25px;
  font-weight: bold;
  margin-top: 12px;
}

.note {
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    Garena
  </div>

  <h1>Register</h1>

  <div class="field">
    <span class="icon">✉</span>
    Gmail
  </div>

  <div class="field">
    <span class="icon">🔒</span>
    Password
  </div>

  <button type="button">
    Login
  </button>

  <p class="note">
    Fan-made design preview. Not an official login.
  </p>

</div>

</body>
</html>
