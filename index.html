
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>

<style>
body {
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 50px 20px;
}

.logo {
  color: red;
  font-size: 45px;
  font-weight: bold;
  margin-bottom: 40px;
}

h1 {
  color: #111827;
  font-size: 36px;
}

input {
  box-sizing: border-box;
  width: 100%;
  padding: 18px;
  margin: 12px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 18px;
  margin-top: 20px;
  background: red;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 22px;
  font-weight: bold;
}

.note {
  color: #666;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="logo">Garena</div>

<h1>Register</h1>

<p class="note">Practice interface only</p>

<input
  type="text"
  placeholder="Sample Gmail"
  autocomplete="off"
>

<input
  type="text"
  placeholder="Sample password (not real)"
  autocomplete="off"
>

<button onclick="window.location.href='error.html'">
Login
</button>

</body>
</html>
